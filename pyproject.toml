[project]
name = "django-easy-kitchen"
version = "0.7.0"
description = "A simple, private shopping list application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3",
  "django-allauth[socialaccount]>=65.13,<66",
  "djangorestframework>=3.18.2,<3.19",
  "drf-spectacular[sidecar]>=0.30,<0.31",
  "gunicorn>=27.0.1,<28",
  "mcp>=2.3,<2.4",
  "pillow>=13,<14",
  "psycopg[binary]>=3.2,<4",
  "reportlab>=5.1.2,<6",
]

[dependency-groups]
dev = [
  "django-stubs>=5.2,<5.3",
  "djangorestframework-stubs>=3.16,<4",
  "pyright>=1.1.414,<1.2",
  "pytest>=8.3,<10",
  "pytest-django>=4.9,<5",
  "pytest-playwright>=0.7,<1",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.17.6,<0.18",
]
docs = [
  "myst-parser>=5.2,<6",
  "sphinx>=9.0.4,<9.1",
  "sphinx-rtd-theme>=3.0,<4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings.test"
pythonpath = ["src"]
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["src", "e2e"]
addopts = ["-n", "auto"]
markers = [
  "e2e: browser-based end-to-end tests",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The rules CI has always checked (ruff's defaults before 0.17). ruff 0.17 switched on about 20 more rule families
# by default; adopting any of them is a separate decision, not a side effect of an update.
# Plus docstrings for every module, class, function, and method (D100-D105); `class Meta` (D106) and `__init__`
# (D107) are covered by the class docstring. Tests need only a module docstring: their names state the behaviour.
select = ["E4", "E7", "E9", "F", "D100", "D101", "D102", "D103", "D104", "D105"]

[tool.ruff.lint.per-file-ignores]
"src/easy_kitchen/tests/**" = ["D101", "D102", "D103", "D104", "D105"]
"e2e/**" = ["D101", "D102", "D103", "D104", "D105"]
"**/migrations/**" = ["D"]

[tool.pyright]
# CI runs `uv run pyright`; it must report no errors. Application code only.
include = ["src/easy_kitchen", "src/project", "src/accounts"]
exclude = ["src/easy_kitchen/tests", "**/migrations"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
typeCheckingMode = "standard"

