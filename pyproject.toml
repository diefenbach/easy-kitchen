[project]
name = "django-easy-kitchen"
version = "0.7.0"
description = "A simple, private shopping list application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3",
  "django-allauth[socialaccount]>=65.13,<66",
  "djangorestframework>=3.18.2,<3.19",
  "drf-spectacular[sidecar]>=0.30,<0.31",
  "gunicorn>=23,<24",
  "mcp>=2.3,<2.4",
  "pillow>=13,<14",
  "psycopg[binary]>=3.2,<4",
  "reportlab>=4.2,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-django>=4.9,<5",
  "pytest-playwright>=0.7,<1",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.14,<0.15",
]
docs = [
  "myst-parser>=5.2,<6",
  "sphinx>=9.0.4,<9.1",
  "sphinx-rtd-theme>=3.0,<4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings.test"
pythonpath = ["src"]
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["src", "e2e"]
addopts = ["-n", "auto"]
markers = [
  "e2e: browser-based end-to-end tests",
]

[tool.ruff]
line-length = 100

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
extraPaths = ["src"]
