[project]
name = "django-easy-kitchen"
version = "0.6.0"
description = "A simple, private shopping list application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.15,<3.17",
  "drf-spectacular[sidecar]>=0.30,<0.31",
  "gunicorn>=23,<24",
  "mcp>=2.3,<2.4",
  "pillow>=11,<12",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "pytest-playwright>=0.7,<1",
  "pytest-xdist>=3.6,<4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings.test"
pythonpath = ["src"]
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["src", "e2e"]
addopts = ["-n", "auto"]
markers = [
  "e2e: browser-based end-to-end tests",
]

[tool.ruff]
line-length = 100
