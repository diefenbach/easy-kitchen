# Weekly update PRs, one per ecosystem. Each PR runs the full CI (tests and image probe); merging one that touches
# runtime files (uv.lock, Dockerfile) deploys like any other merge. Security updates come separately and at once.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Two groups: tooling (lint, format) is not shipped and its PRs pass on their own. The frontend libraries are
  # copied into src/easy_kitchen/static/easy_kitchen/vendor/, which Dependabot does not rebuild, so their PR fails
  # `vendor:check` until someone runs `npm run vendor:build` and commits the result; then check the pages.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["bootstrap", "bootstrap-icons", "htmx.org", "sortablejs"]
      tooling:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new Python version (3.13 -> 3.14) is a deliberate change, not a routine update.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
