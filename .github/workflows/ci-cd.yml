name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deploy:
              - 'src/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check src/easy_kitchen
      - run: uv run sphinx-build -W -b html docs docs/_build/html
      - run: uv run playwright install --with-deps chromium
      - run: uv run python -m pytest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_DB: easykitchen_test
          POSTGRES_USER: easykitchen_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: easykitchen_test
      POSTGRES_USER: easykitchen_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: >-
          uv run python -m pytest --ds=project.settings.postgresql_test -n 0
          src/easy_kitchen/tests/test_postgresql_writes.py
          src/easy_kitchen/tests/test_write_integrity.py
          src/easy_kitchen/tests/test_quantity_and_order_integrity.py
          src/easy_kitchen/tests/test_export_regressions.py
          src/easy_kitchen/tests/test_pdf_image_regressions.py
          src/easy_kitchen/tests/test_planner_boundaries.py

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:vendor
      - run: npm run vendor:check
      - run: npm run lint
      - run: npm run format:check

  build:
    # Every pull request and push: build the image and probe it under the production settings. Only a push to
    # main with runtime changes pushes it to ghcr.io/diefenbach/easy-kitchen:<tag> and deploys it. <tag> is the
    # commit date (Europe/Berlin) and the short commit, e.g. 20261125-02f9793; a re-run gives the same tag.
    needs: [changes, test, postgres, javascript]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_DB: probe
          POSTGRES_USER: probe
          POSTGRES_PASSWORD: probe-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      IMAGE: ghcr.io/diefenbach/easy-kitchen
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag
        id: tag
        run: |
          tag="$(TZ=Europe/Berlin git log -1 --format=%cd --date=format-local:%Y%m%d)-$(git rev-parse --short=7 HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Image: \`${IMAGE}:$tag\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: check, migrate, WSGI import and collectstatic under production settings
        # Fails if settings, migrations, the WSGI module (it refuses to start with unapplied migrations) or static
        # files are broken. The values are dummies against the empty Postgres service above; the probe sets every
        # variable that production.py requires (test_deploy.py checks that).
        run: |
          docker run --rm --network host \
            -e DJANGO_SETTINGS_MODULE=project.settings.production \
            -e DJANGO_SECRET_KEY=ci-only \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost \
            -e POSTGRES_DB=probe -e POSTGRES_USER=probe -e POSTGRES_PASSWORD=probe-only-password \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_PORT=5432 \
            -e DJANGO_DEFAULT_FROM_EMAIL=ci@localhost -e EMAIL_HOST=localhost \
            "${IMAGE}:${TAG}" \
            sh -c "python manage.py check && python manage.py migrate --noinput -v 0 && python -c 'import project.wsgi' && python manage.py collectstatic --noinput -v 0"
      - name: Push
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:${TAG}"
      - name: Delete old images (keep the last 10)
        if: env.PUBLISH == 'true'
        # Housekeeping only: a failure here must never block the deploy. Deleting needs the Admin role for this
        # repository on the package (iqpp_prod/docs/access.md).
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: easy-kitchen
          package-type: container
          min-versions-to-keep: 10

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    needs: [changes, build]
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
