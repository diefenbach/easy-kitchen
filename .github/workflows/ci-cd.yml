name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deploy:
              - 'src/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/scripts/**'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check src/easy_kitchen
      - run: uv run sphinx-build -W -b html docs docs/_build/html
      - run: uv run playwright install --with-deps chromium
      - run: uv run python -m pytest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_DB: easykitchen_test
          POSTGRES_USER: easykitchen_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: easykitchen_test
      POSTGRES_USER: easykitchen_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: >-
          uv run python -m pytest --ds=project.settings.postgresql_test -n 0
          src/easy_kitchen/tests/test_postgresql_writes.py
          src/easy_kitchen/tests/test_write_integrity.py
          src/easy_kitchen/tests/test_quantity_and_order_integrity.py
          src/easy_kitchen/tests/test_export_regressions.py
          src/easy_kitchen/tests/test_pdf_image_regressions.py
          src/easy_kitchen/tests/test_planner_boundaries.py

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:vendor
      - run: npm run vendor:check
      - run: npm run lint
      - run: npm run format:check

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    needs: [changes, test, postgres, javascript]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):$GITHUB_SHA"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: kitchen-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy over SSH
        run: |
          set -eux
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          scp .github/scripts/deploy.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/easykitchen-deploy.sh"
          ssh -o ServerAliveInterval=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod +x /tmp/easykitchen-deploy.sh && DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' /tmp/easykitchen-deploy.sh '${{ needs.build.outputs.image }}'"
