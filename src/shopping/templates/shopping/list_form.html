{% extends "shopping/base.html" %}
{% block content %}<div class="row justify-content-center"><div class="col-md-7"><h1 class="h2 mb-4">{% if object %}Liste bearbeiten{% else %}Neue Liste{% endif %}</h1><form method="post" class="card shadow-sm"><div class="card-body">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="card-footer bg-white d-flex gap-2"><button class="btn btn-primary">Speichern</button><a class="btn btn-outline-secondary" href="{{ cancel_url }}">Abbrechen</a></div></form></div></div>{% endblock %}
