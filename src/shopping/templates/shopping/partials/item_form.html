<form hx-post="{% url 'shopping:item-create' object.pk %}" hx-target="#items" hx-swap="beforeend" hx-on::after-request="if(event.detail.successful) this.reset()" class="row g-2 align-items-end">{% csrf_token %}<div class="col-12 col-sm"><label class="form-label" for="{{ form.name.id_for_label }}">Artikel</label>{{ form.name }}</div><div class="col-7 col-sm-3"><label class="form-label" for="{{ form.quantity.id_for_label }}">Menge</label>{{ form.quantity }}</div><div class="col-5 col-sm-auto"><button class="btn btn-primary w-100">Hinzufügen</button></div></form>
