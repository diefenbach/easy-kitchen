<div class="shopping-item card mb-2 {% if item.checked %}checked{% endif %}" data-item-id="{{ item.id }}"><div class="card-body py-2 px-3 d-flex align-items-center gap-2"><button class="drag-handle btn btn-sm text-secondary" type="button" aria-label="Verschieben">⠿</button><button class="btn btn-sm p-0 border-0 bg-transparent" hx-post="{% url 'shopping:item-toggle' shopping_list.pk item.pk %}" hx-target="closest .shopping-item" hx-swap="outerHTML" aria-label="Erledigt umschalten"><span class="checkmark">{% if item.checked %}☑{% else %}☐{% endif %}</span></button><div class="flex-grow-1"><span class="item-name">{{ item.name }}</span>{% if item.quantity %}<small class="text-secondary ms-2">{{ item.quantity }}</small>{% endif %}</div><button class="btn btn-sm btn-outline-secondary" hx-get="{% url 'shopping:item-update' shopping_list.pk item.pk %}" hx-target="closest .shopping-item" hx-swap="outerHTML">Bearbeiten</button><button class="btn btn-sm btn-outline-danger" hx-post="{% url 'shopping:item-delete' shopping_list.pk item.pk %}" hx-target="closest .shopping-item" hx-swap="outerHTML" hx-confirm="Artikel löschen?">×</button></div></div>
