<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EasyList{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  {% load static %}<link href="{% static 'shopping/easylist.css' %}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand bg-white border-bottom mb-4"><div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'shopping:list' %}">EasyList</a>
    {% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Abmelden</button></form>{% endif %}
  </div></nav>
  <main class="container pb-5">{% block content %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.body.addEventListener("htmx:configRequest", (event) => {
      const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]")?.value;
      if (csrfToken) event.detail.headers["X-CSRFToken"] = csrfToken;
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
