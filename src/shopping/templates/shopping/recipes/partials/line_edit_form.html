{% load i18n %}
<div class="recipe-line card mb-2" data-line-id="{{ line.id }}">
  <form class="card-body py-2 px-3 row g-2 align-items-end" hx-post="{{ update_url }}" hx-target="closest .recipe-line" hx-swap="outerHTML">
    {% csrf_token %}
    {% if kind == "ingredient" %}
      <div class="col">
        <label class="visually-hidden" for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
        {{ form.name }}
        {{ form.name.errors }}
      </div>
      <div class="col-4">
        <label class="visually-hidden" for="{{ form.quantity.id_for_label }}">{{ form.quantity.label }}</label>
        {{ form.quantity }}
        {{ form.quantity.errors }}
      </div>
    {% else %}
      <div class="col">
        <label class="visually-hidden" for="{{ form.text.id_for_label }}">{{ form.text.label }}</label>
        {{ form.text }}
        {{ form.text.errors }}
      </div>
    {% endif %}
    <div class="col-auto">
      <button class="btn btn-primary btn-sm" aria-label="{% translate 'Save' %}">
        <i class="bi bi-check-lg" aria-hidden="true"></i>
        <span class="d-none d-md-inline">{% translate "Save" %}</span>
      </button>
    </div>
  </form>
</div>
