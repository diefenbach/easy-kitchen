{% extends "shopping/base.html" %}
{% load i18n %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h3">{% translate "Delete list?" %}</h1>
        <p>{% blocktranslate with title=object.title %}"{{ title }}" and all items will be permanently deleted.{% endblocktranslate %}</p>
        <form method="post">
          {% csrf_token %}
          <button class="btn btn-danger" aria-label="{% translate 'Delete permanently' %}">
            <i class="bi bi-trash" aria-hidden="true"></i>
            <span class="d-none d-md-inline">{% translate "Delete permanently" %}</span>
          </button>
          <a class="btn btn-outline-secondary" href="{% url 'shopping:detail' object.pk %}" aria-label="{% translate 'Cancel' %}">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
            <span class="d-none d-md-inline">{% translate "Cancel" %}</span>
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
