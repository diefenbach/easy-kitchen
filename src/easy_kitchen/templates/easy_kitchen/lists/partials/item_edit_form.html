{% load i18n %}
<div class="shopping-item card mb-2" data-item-id="{{ item.id }}">
  <form class="card-body py-2 px-3 row g-2 align-items-center" hx-post="{% url 'easy_kitchen:item-update' item.shopping_list.pk item.pk %}" hx-target="closest .shopping-item" hx-swap="outerHTML">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="col-sm">
      <div class="article-field">
        <label class="visually-hidden" for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
        {{ form.name }}
        {{ form.name.errors }}
        <ul class="article-suggestions" role="listbox" hidden aria-label="{% translate 'Articles' %}"></ul>
      </div>
    </div>
    <div class="col-sm-3">
      <label class="visually-hidden" for="{{ form.quantity.id_for_label }}">{{ form.quantity.label }}</label>
      {{ form.quantity }}{{ form.quantity.errors }}
    </div>
  <div class="col-12 col-sm-3">
    <label class="form-label" for="{{ form.department.id_for_label }}">{{ form.department.label }}</label>
    {{ form.department }}{{ form.department.errors }}
  </div>
    <div class="col-sm-auto">
      <button class="btn btn-primary btn-sm" aria-label="{% translate 'Save' %}">
        <i class="bi bi-check-lg" aria-hidden="true"></i>
        <span class="d-none d-md-inline">{% translate "Save" %}</span>
      </button>
    </div>
  </form>
</div>
