{% load i18n %}
<div class="editor-line border rounded p-3 mb-3"{% if line.cleaned_data.DELETE %} hidden{% endif %}>
  {% for hidden in line.hidden_fields %}{{ hidden }}{{ hidden.errors }}{% endfor %}
  {{ line.non_field_errors }}
  <div class="d-flex align-items-center gap-2 mb-3">
    <span class="text-secondary" data-editor-number></span>
    <button type="button" class="btn btn-sm btn-outline-secondary editor-drag" disabled aria-label="{% translate 'Move' %}"><i class="bi bi-grip-vertical" aria-hidden="true"></i></button>
    <button type="button" class="btn btn-sm btn-outline-secondary" data-editor-up disabled aria-label="{% translate 'Move up' %}"><i class="bi bi-arrow-up" aria-hidden="true"></i></button>
    <button type="button" class="btn btn-sm btn-outline-secondary" data-editor-down disabled aria-label="{% translate 'Move down' %}"><i class="bi bi-arrow-down" aria-hidden="true"></i></button>
    <button type="button" class="btn btn-sm btn-outline-danger ms-auto" data-editor-remove disabled aria-label="{% translate 'Remove item' %}"><i class="bi bi-trash" aria-hidden="true"></i></button>
  </div>
  <div class="row g-3">
    {% for field in line.visible_fields %}
      {% if field.name == "checked" %}
        <div class="col-12"><div class="form-check">{{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field.errors }}</div></div>
      {% else %}
        <div class="{% if field.name == 'quantity' %}col-12 col-sm-4{% else %}col-12 col-sm-8{% endif %}"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
      {% endif %}
    {% endfor %}
  </div>
</div>
