{% extends "easy_kitchen/base.html" %}
{% load i18n list_icons %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h1 class="h2 mb-4">{% if object %}{% translate "Edit list" %}{% else %}{% translate "New list" %}{% endif %}</h1>
    <form method="post" class="card shadow-sm">
      <div class="card-body">
        {% csrf_token %}
        {% include "easy_kitchen/lists/partials/form_fields.html" %}
      </div>
      <div class="card-footer bg-white d-flex gap-2">
        <button class="btn btn-primary" aria-label="{% translate 'Save' %}">
          <i class="bi bi-check-lg" aria-hidden="true"></i>
          <span class="d-none d-md-inline">{% translate "Save" %}</span>
        </button>
        <a class="btn btn-outline-secondary" href="{{ cancel_url }}" aria-label="{% translate 'Cancel' %}">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
          <span class="d-none d-md-inline">{% translate "Cancel" %}</span>
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
